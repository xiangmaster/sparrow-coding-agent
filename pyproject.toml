[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sparrow-coding-agent"
version = "0.1.0"
description = "一个从零实现、便于理解和检查的编程智能体"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "openai>=1.50,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
]
gui = [
  "PySide6-Essentials>=6.8,<7",
]

[project.scripts]
sparrow = "sparrow_agent.cli:main"
sparrow-gui = "sparrow_agent.gui:main"
sparrow-gui-legacy = "sparrow_agent.desktop:run_desktop"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "api_smoke: 访问真实 DeepSeek API、默认跳过且可能产生少量费用",
  "gui_smoke: 需要 PySide6 和可用 Qt 平台插件的桌面界面冒烟测试",
]

[tool.coverage.run]
omit = [
  "src/sparrow_agent/desktop.py",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sparrow_agent"]
